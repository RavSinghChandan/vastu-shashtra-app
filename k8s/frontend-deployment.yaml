apiVersion: apps/v1
kind: Deployment
metadata:
  name: vastu-frontend
  namespace: vastu-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vastu-frontend
  template:
    metadata:
      labels:
        app: vastu-frontend
    spec:
      containers:
      - name: frontend
        image: ${ECR_REGISTRY}/vastu-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vastu-frontend
  namespace: vastu-prod
spec:
  selector:
    app: vastu-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP 