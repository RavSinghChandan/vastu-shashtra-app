apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vastu-ingress
  namespace: vastu-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - yourdomain.com
    secretName: vastu-tls
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vastu-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vastu-backend
            port:
              number: 8080 